/* ── canvas helpers (authored in 1080-wide design space, scaled by k) ──── */
const font = (weight, sizePx, family, style = "normal") => `${style} ${weight} ${sizePx}px ${family}`;

function wrapLines(ctx, text, maxWidth) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}

// Shrink until wrapped text fits a box — prevents overflow automatically.
function fitText(ctx, text, maxW, maxH, lineHeightRatio, startSize, minSize, fontFn) {
  let s = startSize;
  const step = Math.max(1, Math.round(startSize * 0.04));
  while (s >= minSize) {
    ctx.font = fontFn(s);
    const lines = wrapLines(ctx, text, maxW);
    if (lines.length * s * lineHeightRatio <= maxH) return { size: s, lines };
    s -= step;
  }
  ctx.font = fontFn(minSize);
  return { size: minSize, lines: wrapLines(ctx, text, maxW) };
}

// Manual letter-spacing (canvas letterSpacing support is inconsistent on iOS).
function fillSpaced(ctx, text, x, y, spacing, align = "center") {
  const chars = [...String(text)];
  const widths = chars.map((c) => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  const prev = ctx.textAlign;
  ctx.textAlign = "left";
  for (let i = 0; i < chars.length; i++) { ctx.fillText(chars[i], cx, y); cx += widths[i] + spacing; }
  ctx.textAlign = prev;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Cover-fit (center-crop), like CSS object-fit: cover.
function drawCover(ctx, img, x, y, w, h) {
  const ir = img.width / img.height, br = w / h;
  let sw, sh, sx, sy;
  if (ir > br) { sh = img.height; sw = sh * br; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / br; sx = 0; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

// Draw a single-color logo on transparent bg, recolored ("tinted") to `color`.
// Uses source-in compositing so the logo shape is preserved but recolored to
// contrast with each slide background — one upload works on every theme.
function drawTinted(ctx, img, x, y, w, h, color) {
  const off = document.createElement("canvas");
  off.width = Math.max(1, Math.round(w));
  off.height = Math.max(1, Math.round(h));
  const o = off.getContext("2d");
  // contain-fit the logo inside the box (no cropping), centered
  const ir = img.width / img.height, br = w / h;
  let dw, dh, dx, dy;
  if (ir > br) { dw = w; dh = w / ir; dx = 0; dy = (h - dh) / 2; }
  else { dh = h; dw = h * ir; dy = 0; dx = (w - dw) / 2; }
  o.drawImage(img, dx, dy, dw, dh);
  o.globalCompositeOperation = "source-in";
  o.fillStyle = color;
  o.fillRect(0, 0, w, h);
  ctx.drawImage(off, x, y);
}

// Contain-fit (show the WHOLE image, no crop) — used for content diagrams in
// one-pagers. Unlike drawTinted, the image keeps its real colors.
function drawContain(ctx, img, x, y, w, h) {
  const ir = img.width / img.height, br = w / h;
  let dw, dh;
  if (ir > br) { dw = w; dh = w / ir; } else { dh = h; dw = h * ir; }
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

function isLight(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b > 150;
}

/* ── THE RENDERER — draws one slide at pixel width `w` (height derived) ─── */
function renderSlide(ctx, w, slide, idx, total, brand, opts, getImg, monogramSrc) {
  const k = w / BASE_W;
  const P = (v) => v * k;
  const h = Math.round(w * RATIO);
  const th = THEMES[slide.theme] || THEMES.cream;

  const F = {
    display: (s) => font(900, s, "Montserrat"),      // Avenir Black stand-in
    display8: (s) => font(800, s, "Montserrat"),
    serif: (s) => font(600, s, "'Playfair Display'"),  // Minerva Modern-ish, editorial
    serifIt: (s) => font(500, s, "'Playfair Display'", "italic"),
    numeral: (s) => font(500, s, "'Playfair Display'"),  // clear, legible digits
    script: (s) => font(400, s, "'" + (opts.scriptFont || "Allura") + "'"),  // Benedict stand-in — user picks
    body: (s) => font(400, s, "Lato"),                  // her actual font
    bodyMed: (s) => font(700, s, "Lato"),
  };

  const top = P(200), bottom = h - P(225), left = P(120), right = w - P(120);
  const cx = w / 2, width = right - left;

  ctx.fillStyle = th.bg;
  ctx.fillRect(0, 0, w, h);

  if (opts.frame) {
    ctx.strokeStyle = th.rule;
    ctx.lineWidth = P(2);
    ctx.strokeRect(P(50), P(50), w - P(100), h - P(100));
  }

  ctx.textBaseline = "alphabetic";
  const goldRule = (y, half = 52) => {
    ctx.strokeStyle = th.rule; ctx.lineWidth = P(2);
    ctx.beginPath(); ctx.moveTo(cx - P(half), y); ctx.lineTo(cx + P(half), y); ctx.stroke();
  };

  /* ---- COVER ---- */
  if (slide.template === "cover") {
    const mono = opts.monogram && monogramSrc ? getImg(monogramSrc) : null;
    let cTop = top;
    if (mono) {
      const mW = P(180), mH = P(120);
      drawTinted(ctx, mono, cx - mW / 2, P(160), mW, mH, th.accent);
      cTop = P(160) + mH + P(56);
    }
    if (slide.kicker) {
      ctx.fillStyle = th.sub;
      ctx.font = F.bodyMed(P(22));
      fillSpaced(ctx, slide.kicker.toUpperCase(), cx, cTop + P(6), P(4), "center");
    }
    const blockTop = cTop + (slide.kicker ? P(54) : 0);
    const { size: hs, lines: hl } = fitText(ctx, slide.headline || "", width, P(560), 1.05, P(120), P(52), F.display);
    const accent = (slide.accentWord || "").trim();
    const accSize = accent ? Math.min(P(150), hs * 1.28) : 0;
    const blockH = hl.length * hs * 1.05 + (accent ? accSize * 0.72 : 0);
    let y = (blockTop + (h - P(196))) / 2 - blockH / 2 + hs;
    ctx.fillStyle = th.text;
    ctx.font = F.display(hs);
    for (const ln of hl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += hs * 1.05; }
    if (accent) {
      ctx.fillStyle = th.accent; ctx.font = F.script(accSize); ctx.textAlign = "center";
      ctx.fillText(accent, cx, y + accSize * 0.3); ctx.textAlign = "left";
    }
  }

  /* ---- LIST ---- */
  else if (slide.template === "list") {
    const { size: ts, lines: tl } = fitText(ctx, slide.title || "", width, P(240), 1.05, P(84), P(40), F.display);
    let y = top + ts;
    ctx.fillStyle = th.text;
    for (const ln of tl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += ts * 1.05; }
    if ((slide.accentWord || "").trim()) {
      const as = Math.min(P(92), ts * 1.15);
      ctx.fillStyle = th.accent; ctx.font = F.script(as); ctx.textAlign = "center";
      ctx.fillText(slide.accentWord.trim(), cx, y + as * 0.5); ctx.textAlign = "left"; y += as * 0.7;
    }
    y += P(38); goldRule(y); y += P(56);
    const items = String(slide.items || "").split("\n").map((s) => s.trim()).filter(Boolean);
    const n = Math.max(items.length, 1);
    const slot = Math.min((bottom - P(30) - y) / n, P(168));
    const isz = P(36);
    items.forEach((it, i) => {
      const numW = P(72);
      if (slide.bullet) { ctx.fillStyle = th.accent; ctx.font = F.bodyMed(P(40)); ctx.fillText("\u2014", left, y + slot / 2 + P(14)); }
      else { ctx.fillStyle = th.accent; ctx.font = F.numeral(P(50)); ctx.fillText(String(i + 1), left + P(4), y + slot / 2 + P(17)); }
      ctx.fillStyle = th.text; ctx.font = F.body(isz);
      const tx = left + numW, tw = width - numW;
      const lines = wrapLines(ctx, it, tw);
      const lh = isz * 1.28;
      let by = y + slot / 2 - ((lines.length - 1) * lh) / 2 + isz * 0.34;
      for (const ln of lines) { ctx.fillText(ln, tx, by); by += lh; }
      y += slot;
    });
  }

  /* ---- NUMBER (editorial: clear digit, stacked, balanced) ---- */
  else if (slide.template === "number") {
    // Compose the whole block (number → rule → headline → subtext), measure its
    // height, then center it vertically so the slide is always balanced and the
    // headline uses the FULL width (the old side-by-side layout overflowed).
    const num = String(slide.number || "").trim();
    const numSize = P(210);                         // large but legible Playfair digit
    const ruleGap = P(38), ruleToHead = P(46);

    ctx.font = F.display(P(96));
    const { size: hs, lines: hl } = fitText(ctx, slide.headline || "", width, P(340), 1.06, P(94), P(46), F.display);
    const headH = hl.length * hs * 1.06;

    // Body is bigger for readability; if a long, detailed body would overflow
    // the safe area, it shrinks gently (down to a floor) rather than colliding.
    const hasSub = !!(slide.subtext || "").trim();
    const avail = bottom - top;
    let subSize = P(33), subLines = [];
    if (hasSub) {
      const fixed = numSize * 0.74 + ruleGap + ruleToHead + headH + P(40);
      subSize = P(33);
      while (subSize > P(26)) {
        ctx.font = F.body(subSize);
        subLines = wrapLines(ctx, slide.subtext.trim(), width - P(80));
        if (fixed + subLines.length * subSize * 1.45 <= avail) break;
        subSize -= P(1);
      }
      ctx.font = F.body(subSize);
      subLines = wrapLines(ctx, slide.subtext.trim(), width - P(80));
    }
    const subH = subLines.length ? subLines.length * subSize * 1.45 + P(40) : 0;

    const blockH = numSize * 0.74 + ruleGap + ruleToHead + headH + subH;
    let y = (top + bottom) / 2 - blockH / 2;

    // number
    ctx.fillStyle = th.accent;
    ctx.font = F.numeral(numSize);
    ctx.textAlign = "center";
    ctx.fillText(num, cx, y + numSize * 0.74);
    ctx.textAlign = "left";
    y += numSize * 0.74 + ruleGap;
    // short gold rule
    goldRule(y, 40);
    y += ruleToHead;
    // headline (full width, centered, Montserrat caps)
    ctx.fillStyle = th.text;
    ctx.font = F.display(hs);
    for (const ln of hl) { fillSpaced(ctx, ln.toUpperCase(), cx, y + hs * 0.82, P(1), "center"); y += hs * 1.06; }
    // subtext
    if (subLines.length) {
      y += P(40);
      ctx.fillStyle = th.sub; ctx.font = F.body(subSize); ctx.textAlign = "center";
      for (const ln of subLines) { ctx.fillText(ln, cx, y); y += subSize * 1.45; }
      ctx.textAlign = "left";
    }
  }

  /* ---- STAT (donut chart) — donut + legend always fit above the footer ---- */
  else if (slide.template === "stat") {
    const { size: ts, lines: tl } = fitText(ctx, slide.title || "", width, P(220), 1.05, P(78), P(38), F.display);
    let y = top + ts;
    ctx.fillStyle = th.text;
    for (const ln of tl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += ts * 1.05; }
    if ((slide.accentWord || "").trim()) {
      const as = Math.min(P(86), ts * 1.15);
      ctx.fillStyle = th.accent; ctx.font = F.script(as); ctx.textAlign = "center";
      ctx.fillText(slide.accentWord.trim(), cx, y + as * 0.5); ctx.textAlign = "left"; y += as * 0.7;
    }
    const titleBottom = y + P(20);

    const segs = String(slide.segments || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
      const parts = l.split("|");
      return { value: Math.max(0, parseFloat(parts[0]) || 0), label: (parts.slice(1).join("|") || "").trim() };
    }).filter((s) => s.value > 0).slice(0, 5);
    const totalVal = segs.reduce((a, b) => a + b.value, 0) || 1;
    const palette = STAT_COLORS[slide.theme] || STAT_COLORS.cream;

    // Each label sits radially outside the ring, centred on its own colour —
    // no separate legend box needed. Size R so the ring + labels fit snugly.
    const footTop_st = h - P(196);
    const labelPad = P(58);   // clearance for labels outside the ring
    const maxRv = (footTop_st - titleBottom) / 2 - labelPad;
    const maxRh = width / 2 - P(110);
    const R = Math.max(P(110), Math.min(P(190), maxRv, maxRh));
    const inner = R * 0.60;
    const centerY = (titleBottom + footTop_st) / 2;

    // draw segments
    let a0 = -Math.PI / 2;
    segs.forEach((s, i) => {
      const a1 = a0 + (s.value / totalVal) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx, centerY); ctx.arc(cx, centerY, R, a0, a1); ctx.closePath();
      ctx.fillStyle = palette[i % palette.length]; ctx.fill();
      a0 = a1;
    });
    ctx.beginPath(); ctx.arc(cx, centerY, inner, 0, Math.PI * 2); ctx.fillStyle = th.bg; ctx.fill();

    // percentage on the ring band + text label just outside, both at each
    // segment's mid-angle so each is perfectly centred on its own colour
    a0 = -Math.PI / 2;
    segs.forEach((s, i) => {
      const frac = s.value / totalVal;
      const mid = a0 + frac * Math.PI;
      // % inside the band
      const lr = (R + inner) / 2;
      const px = cx + Math.cos(mid) * lr, py = centerY + Math.sin(mid) * lr;
      ctx.fillStyle = isLight(palette[i % palette.length]) ? "#20272D" : "#FCF9F6";
      ctx.font = F.display(P(30));
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(Math.round(frac * 100) + "%", px, py);
      // text label outside the ring
      const lo = R + P(46);
      const lx = cx + Math.cos(mid) * lo, ly = centerY + Math.sin(mid) * lo;
      const cos = Math.cos(mid);
      ctx.font = F.bodyMed(P(28)); ctx.fillStyle = th.text; ctx.textBaseline = "middle";
      if (cos > 0.22) ctx.textAlign = "left";
      else if (cos < -0.22) ctx.textAlign = "right";
      else ctx.textAlign = "center";
      ctx.fillText(s.label || "", lx, ly);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      a0 += frac * Math.PI * 2;
    });
  }

  /* ---- STATEMENT / QUOTE (editorial, no diamonds) ---- */
  else if (slide.template === "statement") {
    const { size: qs, lines: ql } = fitText(ctx, slide.text || "", width, P(600), 1.22, P(86), P(40), F.serifIt);
    const blockH = ql.length * qs * 1.22;
    // top hairline
    let y = (top + bottom) / 2 - blockH / 2 - P(46);
    goldRule(y, 44);
    y += P(46) + qs * 0.8;
    ctx.fillStyle = th.text; ctx.font = F.serifIt(qs); ctx.textAlign = "center";
    for (const ln of ql) { ctx.fillText(ln, cx, y); y += qs * 1.22; }
    ctx.textAlign = "left";
    if ((slide.signature || "").trim()) {
      ctx.fillStyle = th.accent; ctx.font = F.script(P(64)); ctx.textAlign = "center";
      ctx.fillText(slide.signature.trim(), cx, y + P(50)); ctx.textAlign = "left";
    } else {
      goldRule(y + P(16), 44);   // bottom hairline mirrors the top
    }
  }

  /* ---- TIP (centered block, bigger body, balanced) ---- */
  else if (slide.template === "tip") {
    const { size: hs, lines: hl } = fitText(ctx, slide.heading || "", width - P(80), P(230), 1.05, P(76), P(40), F.display);
    const headH = hl.length * hs * 1.05;
    const accent = (slide.accentWord || "").trim();
    const accSize = accent ? Math.min(P(84), hs * 1.12) : 0;
    const ruleGap = P(34), ruleToBody = P(50);
    const paras = String(slide.body || "").split("\n").map((s) => s.trim()).filter(Boolean);

    // The usable area is everything ABOVE the footer logo; centering the block
    // here gives equal breathing room top and bottom (no drift, no empty pool).
    const footTop = h - P(196);
    const fixedH = headH + (accent ? accSize * 0.95 : 0) + ruleGap + ruleToBody;
    const avail = footTop - top;
    let bsz = P(40);
    const measureBody = (sz) => {
      ctx.font = F.body(sz); let hh = 0;
      for (const p of paras) hh += wrapLines(ctx, p, width).length * sz * 1.5 + sz * 0.55;
      return hh;
    };
    while (bsz > P(28) && fixedH + measureBody(bsz) > avail) bsz -= P(1);
    const bodyH = measureBody(bsz);
    const blockH = fixedH + bodyH;

    let y = (top + footTop) / 2 - blockH / 2;
    ctx.fillStyle = th.text; ctx.font = F.display(hs);
    for (const ln of hl) { fillSpaced(ctx, ln.toUpperCase(), cx, y + hs * 0.82, P(1.5), "center"); y += hs * 1.05; }
    if (accent) {
      ctx.fillStyle = th.accent; ctx.font = F.script(accSize); ctx.textAlign = "center";
      ctx.fillText(accent, cx, y + accSize * 0.5); ctx.textAlign = "left"; y += accSize * 0.95;
    }
    y += ruleGap; goldRule(y, 44); y += ruleToBody;
    // body — centered for balance, bigger for readability
    ctx.fillStyle = th.text; ctx.font = F.body(bsz); ctx.textAlign = "center";
    for (const p of paras) {
      const lines = wrapLines(ctx, p, width);
      for (const ln of lines) { ctx.fillText(ln, cx, y + bsz * 0.8); y += bsz * 1.5; }
      y += bsz * 0.55;
    }
    ctx.textAlign = "left";
  }

  /* ---- PHOTO ---- */
  else if (slide.template === "photo") {
    const img = slide.image ? getImg(slide.image) : null;
    const full = slide.layout !== "top";
    if (full) {
      if (img) drawCover(ctx, img, 0, 0, w, h);
      else { ctx.fillStyle = th.soft; ctx.fillRect(0, 0, w, h); }
      const g = ctx.createLinearGradient(0, h * 0.42, 0, h);
      g.addColorStop(0, "rgba(20,24,28,0)"); g.addColorStop(1, "rgba(20,24,28,0.86)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      if (slide.headline) {
        const { size: hs, lines: hl } = fitText(ctx, slide.headline, width, P(300), 1.05, P(80), P(40), F.display);
        let y = h - P(165) - hl.length * hs * 1.05;
        ctx.fillStyle = "#FCF9F6";
        for (const ln of hl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += hs * 1.05; }
        if ((slide.accentWord || "").trim()) {
          ctx.fillStyle = "#E7CB97"; ctx.font = F.script(Math.min(P(98), hs * 1.2)); ctx.textAlign = "center";
          ctx.fillText(slide.accentWord.trim(), cx, y + P(56)); ctx.textAlign = "left";
        }
      }
    } else {
      const m = P(58), ph = h * 0.62;
      if (img) drawCover(ctx, img, m, m, w - 2 * m, ph - m);
      else { ctx.fillStyle = th.soft; ctx.fillRect(m, m, w - 2 * m, ph - m); }
      ctx.strokeStyle = th.rule; ctx.lineWidth = P(2); ctx.strokeRect(m, m, w - 2 * m, ph - m);
      let y = ph + P(46);
      if (slide.headline) {
        const { size: hs, lines: hl } = fitText(ctx, slide.headline, width, P(190), 1.05, P(62), P(34), F.display);
        ctx.fillStyle = th.text;
        for (const ln of hl) { fillSpaced(ctx, ln.toUpperCase(), cx, y + hs, P(1.5), "center"); y += hs * 1.05; }
        y += P(26);
      }
      if ((slide.caption || "").trim()) {
        const cs = P(28); ctx.fillStyle = th.sub; ctx.font = F.body(cs); ctx.textAlign = "center";
        const lines = wrapLines(ctx, slide.caption.trim(), width);
        for (const ln of lines) { ctx.fillText(ln, cx, y + cs); y += cs * 1.4; }
        ctx.textAlign = "left";
      }
    }
  }

  /* ---- CTA (editorial; footer logo carries the branding) ---- */
  else if (slide.template === "cta") {
    const av = slide.avatar ? getImg(slide.avatar) : null;
    // Build the block, then center it vertically in the upper-middle so it sits
    // comfortably above the footer logo (which provides the handle/branding).
    const { size: hs, lines: hl } = fitText(ctx, slide.heading || "", width, P(330), 1.05, P(96), P(44), F.display);
    const headH = hl.length * hs * 1.05;
    const accent = (slide.accentWord || "").trim();
    const accSize = accent ? Math.min(P(120), hs * 1.3) : 0;
    let subLines = [];
    if ((slide.subtext || "").trim()) { ctx.font = F.body(P(28)); subLines = wrapLines(ctx, slide.subtext.trim(), width - P(80)); }

    const avH = av ? P(230) + P(54) : 0;
    const blockH = avH + P(40) + P(60) + headH + (accent ? accSize * 0.95 : 0) + P(50) + (subLines.length ? subLines.length * P(28) * 1.4 + P(40) : 0);
    let y = (top + (bottom - P(120))) / 2 - blockH / 2;

    if (av) {
      const r = P(115);
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, y + r, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      drawCover(ctx, av, cx - r, y, r * 2, r * 2); ctx.restore();
      ctx.strokeStyle = th.rule; ctx.lineWidth = P(3);
      ctx.beginPath(); ctx.arc(cx, y + r, r, 0, Math.PI * 2); ctx.stroke();
      y += r * 2 + P(54);
    }
    ctx.fillStyle = th.sub; ctx.font = F.bodyMed(P(23));
    fillSpaced(ctx, "FOLLOW FOR MORE", cx, y, P(5), "center");
    y += P(60);
    ctx.fillStyle = th.text; ctx.font = F.display(hs);
    for (const ln of hl) { fillSpaced(ctx, ln.toUpperCase(), cx, y + hs * 0.82, P(1), "center"); y += hs * 1.05; }
    if (accent) {
      ctx.fillStyle = th.accent; ctx.font = F.script(accSize); ctx.textAlign = "center";
      ctx.fillText(accent, cx, y + accSize * 0.5); ctx.textAlign = "left"; y += accSize * 0.7;
    }
    if (subLines.length) {
      y += P(44); ctx.fillStyle = th.sub; ctx.font = F.body(P(28)); ctx.textAlign = "center";
      for (const ln of subLines) { ctx.fillText(ln, cx, y); y += P(28) * 1.4; }
      ctx.textAlign = "left";
    }
  }

  /* ---- CHART (value | label reference table) — e.g. temperature chart ---- */
  else if (slide.template === "chart") {
    const { size: ts, lines: tl } = fitText(ctx, slide.title || "", width, P(220), 1.05, P(78), P(40), F.display);
    let y = top + ts;
    ctx.fillStyle = th.text;
    for (const ln of tl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += ts * 1.05; }
    if ((slide.accentWord || "").trim()) {
      const as = Math.min(P(86), ts * 1.15);
      ctx.fillStyle = th.accent; ctx.font = F.script(as); ctx.textAlign = "center";
      ctx.fillText(slide.accentWord.trim(), cx, y + as * 0.5); ctx.textAlign = "left"; y += as * 0.7;
    }
    if ((slide.intro || "").trim()) {
      ctx.fillStyle = th.sub; ctx.font = F.body(P(25)); ctx.textAlign = "center";
      for (const ln of wrapLines(ctx, slide.intro.trim(), width)) { y += P(36); ctx.fillText(ln, cx, y); }
      ctx.textAlign = "left";
    }
    y += P(34); goldRule(y); y += P(50);

    // Parse "value | label" rows.
    const rows = String(slide.rows || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
      const parts = l.split("|");
      return { value: (parts[0] || "").trim(), label: (parts.slice(1).join("|") || "").trim() };
    });
    const n = Math.max(rows.length, 1);
    const slot = Math.min((bottom - P(30) - y) / n, P(150));
    const valRight = left + P(180);     // values align on this right edge
    const labX = left + P(220);         // labels start here
    const labMaxW = right - labX;
    rows.forEach((r, i) => {
      const rowMid = y + slot / 2;
      // value (gold, condensed display), right-aligned in its column
      ctx.fillStyle = th.accent; ctx.font = F.display(P(46));
      ctx.textAlign = "right";
      ctx.fillText(r.value, valRight, rowMid + P(16));
      ctx.textAlign = "left";
      // label — shrink to fit one line
      let ls = P(30);
      ctx.font = F.bodyMed(ls);
      while (ls > P(18) && ctx.measureText(r.label.toUpperCase()).width > labMaxW) { ls -= P(1); ctx.font = F.bodyMed(ls); }
      ctx.fillStyle = th.text;
      ctx.fillText(r.label.toUpperCase(), labX, rowMid + P(11));
      // hairline divider
      if (i < rows.length - 1) {
        ctx.strokeStyle = th.soft; ctx.lineWidth = P(1);
        ctx.beginPath(); ctx.moveTo(left, y + slot); ctx.lineTo(right, y + slot); ctx.stroke();
      }
      y += slot;
    });
  }

  /* ---- COMPARE (two stacked panels w/ optional diagram) — e.g. bonds ---- */
  else if (slide.template === "compare") {
    const { size: ts, lines: tl } = fitText(ctx, slide.title || "", width, P(210), 1.05, P(76), P(38), F.display);
    let y = top + ts;
    ctx.fillStyle = th.text;
    for (const ln of tl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += ts * 1.05; }
    if ((slide.accentWord || "").trim()) {
      const as = Math.min(P(82), ts * 1.15);
      ctx.fillStyle = th.accent; ctx.font = F.script(as); ctx.textAlign = "center";
      ctx.fillText(slide.accentWord.trim(), cx, y + as * 0.5); ctx.textAlign = "left"; y += as * 0.7;
    }
    y += P(30);

    const gap = P(46);
    const panelTop = y;
    const panelH = (bottom - panelTop - gap) / 2;

    const panel = (heading, body, imgSrc, py) => {
      let yy = py + P(46);
      ctx.fillStyle = th.accent; ctx.font = F.display(P(40));
      fillSpaced(ctx, (heading || "").toUpperCase(), cx, yy, P(1.5), "center");
      yy += P(24);
      ctx.font = F.body(P(27));
      const bodyLines = wrapLines(ctx, body || "", width - P(40));
      const bodyH = bodyLines.length * P(27) * 1.4;
      const img = imgSrc ? getImg(imgSrc) : null;
      const imgMaxH = (py + panelH) - yy - bodyH - P(28);
      if (img && imgMaxH > P(70)) {
        drawContain(ctx, img, left, yy + P(8), width, imgMaxH);
        yy += imgMaxH + P(20);
      } else {
        yy += P(18);
      }
      ctx.fillStyle = th.text; ctx.font = F.body(P(27)); ctx.textAlign = "center";
      for (const ln of bodyLines) { ctx.fillText(ln, cx, yy + P(27)); yy += P(27) * 1.4; }
      ctx.textAlign = "left";
    };

    panel(slide.headingA, slide.bodyA, slide.imageA, panelTop);
    // clean centered divider between panels (no diamond)
    ctx.strokeStyle = th.rule; ctx.lineWidth = P(1.5);
    ctx.beginPath();
    ctx.moveTo(cx - P(70), panelTop + panelH + gap / 2);
    ctx.lineTo(cx + P(70), panelTop + panelH + gap / 2);
    ctx.stroke();
    panel(slide.headingB, slide.bodyB, slide.imageB, panelTop + panelH + gap);
  }

  /* ---- GUIDE (title + intro + 2x2 labeled grid) — e.g. density guide ---- */
  else if (slide.template === "guide") {
    const { size: ts, lines: tl } = fitText(ctx, slide.title || "", width, P(210), 1.05, P(76), P(38), F.display);
    let y = top + ts;
    ctx.fillStyle = th.text;
    for (const ln of tl) { fillSpaced(ctx, ln.toUpperCase(), cx, y, P(1.5), "center"); y += ts * 1.05; }
    if ((slide.accentWord || "").trim()) {
      const as = Math.min(P(82), ts * 1.15);
      ctx.fillStyle = th.accent; ctx.font = F.script(as); ctx.textAlign = "center";
      ctx.fillText(slide.accentWord.trim(), cx, y + as * 0.5); ctx.textAlign = "left"; y += as * 0.7;
    }
    if ((slide.intro || "").trim()) {
      ctx.fillStyle = th.sub; ctx.font = F.body(P(26)); ctx.textAlign = "center";
      for (const ln of wrapLines(ctx, slide.intro.trim(), width)) { y += P(37); ctx.fillText(ln, cx, y); }
      ctx.textAlign = "left";
    }
    y += P(40);

    const cells = String(slide.cells || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
      const parts = l.split("|");
      return { head: (parts[0] || "").trim(), body: (parts.slice(1).join("|") || "").trim() };
    }).slice(0, 4);
    const rows = Math.max(Math.ceil(cells.length / 2), 1);
    const gx = P(22);
    const cellW = (width - gx) / 2;
    const gridTop = y, gridH = (bottom - P(20)) - gridTop;
    const cellH = (gridH - gx * (rows - 1)) / rows;
    cells.forEach((c, i) => {
      const r = Math.floor(i / 2), col = i % 2;
      const cxx = left + col * (cellW + gx);
      const cyy = gridTop + r * (cellH + gx);
      ctx.strokeStyle = th.rule; ctx.lineWidth = P(1.5);
      roundRect(ctx, cxx, cyy, cellW, cellH, P(12)); ctx.stroke();
      const ccx = cxx + cellW / 2;
      ctx.fillStyle = th.accent; ctx.font = F.display(P(30));
      fillSpaced(ctx, (c.head || "").toUpperCase(), ccx, cyy + P(52), P(0.8), "center");
      ctx.fillStyle = th.text; ctx.font = F.body(P(23)); ctx.textAlign = "center";
      const lines = wrapLines(ctx, c.body || "", cellW - P(44));
      let by = cyy + P(52) + P(40);
      for (const ln of lines) { ctx.fillText(ln, ccx, by); by += P(23) * 1.35; }
      ctx.textAlign = "left";
    });
  }

  /* ---- SHARED FOOTER ----
     Uses Miranda's real lockup (which already includes the handle), tinted to
     contrast with the slide. No diamond. If a logo is somehow missing, fall
     back to a clean typeset wordmark + handle (still no diamond). */
  {
    const onPhoto = slide.template === "photo" && slide.layout !== "top";
    const footerColor = onPhoto ? "#FCF9F6" : th.text;
    const handleColor = onPhoto ? "#E7DCCB" : th.sub;
    const logo = brand.logoImg ? getImg(brand.logoImg) : null;
    if (logo) {
      // Size by width; the lockup is ~1.968:1 and already contains the handle.
      const boxW = P(268), boxH = boxW / LOGO_RATIO;
      const by = h - P(58) - boxH;
      drawTinted(ctx, logo, cx - boxW / 2, by, boxW, boxH, footerColor);
    } else {
      const fy = h - P(74);
      ctx.fillStyle = footerColor; ctx.font = F.serif(P(26));
      fillSpaced(ctx, brand.logo, cx, fy - P(8), P(3), "center");
      ctx.fillStyle = handleColor; ctx.font = F.body(P(18)); ctx.textAlign = "center";
      ctx.fillText(brand.handle, cx, fy + P(18)); ctx.textAlign = "left";
    }
  }

  if (opts.counter) {
    ctx.fillStyle = th.sub; ctx.font = F.bodyMed(P(20)); ctx.textAlign = "right";
    ctx.fillText(`${idx + 1} / ${total}`, right, P(100)); ctx.textAlign = "left";
  }

  if (opts.swipe && idx < total - 1) {
    const ay = h - P(158), ax2 = right, ax1 = right - P(34);
    ctx.strokeStyle = th.accent; ctx.lineWidth = P(2.4);
    ctx.beginPath();
    ctx.moveTo(ax1, ay); ctx.lineTo(ax2, ay);
    ctx.moveTo(ax2 - P(10), ay - P(8)); ctx.lineTo(ax2, ay); ctx.lineTo(ax2 - P(10), ay + P(8));
    ctx.stroke();
    ctx.fillStyle = th.accent; ctx.font = F.serifIt(P(26)); ctx.textAlign = "right";
    ctx.fillText("swipe", ax1 - P(12), ay + P(9)); ctx.textAlign = "left";
  }
}

const SEED = [
  { template: "cover", theme: "gold", kicker: "Miranda | Hair Extension Expert & Salon Owner", headline: "3 Reasons Your K-Tips Might", accentWord: "Suck" },
  { template: "tip", theme: "cream", heading: "It All Starts At The", accentWord: "Bond", body: "Premature failure is almost never the hair's fault — it's the attachment point.\nWhen the bond is wrong for your natural density, every wash and style pulls on a weak link." },
  { template: "number", theme: "navy", number: "1", headline: "Wrong bond size for your density", subtext: "Bond size must match the hair inside a quarter-inch section." },
  { template: "stat", theme: "navy", title: "Where The Work Lives", accentWord: "", segments: "20 | Fitting\n80 | Aftercare" },
  { template: "number", theme: "cream", number: "2", headline: "Heat breaking down the keratin", subtext: "Above ~360°F the keratin softens and the bond loses integrity." },
  { template: "cta", theme: "gold", heading: "Save This For Your Next", accentWord: "Refresh", subtext: "Follow for the science behind extensions that actually last." },
];

const blankSlide = (template, theme = "cream") => {
  const base = { template, theme };
  const fill = {
    cover: { kicker: "Miranda | Hair Extension Expert & Salon Owner", headline: "Your headline here", accentWord: "" },
    list: { title: "Your list title", accentWord: "", items: "First point\nSecond point\nThird point", bullet: false },
    number: { number: "1", headline: "Your point here", subtext: "" },
    stat: { title: "Your stat title", accentWord: "", segments: "80 | Aftercare\n20 | Fitting" },
    statement: { text: "A short, punchy statement your audience will save.", signature: "" },
    tip: { heading: "Your tip heading", accentWord: "", body: "Explain the science here in your own voice." },
    photo: { headline: "On-photo headline", accentWord: "", caption: "", image: null, layout: "full" },
    cta: { heading: "Save this for later", accentWord: "", subtext: "" },
    chart: { title: "Styling Tool Temperatures", accentWord: "Density", intro: "", rows: "280° | Fine thin hair\n320° | Fine medium hair\n360° | Extension hair\n390° | Thick coarse hair\n430° | Please never use" },
    compare: { title: "Brushed vs Unbrushed Bonds", accentWord: "", headingA: "Brushed Bonds", bodyA: "Naturally shed hair lays in the direction of the hair and does not tangle.", imageA: null, headingB: "Unbrushed Bonds", bodyB: "Naturally shed hair tangles with other bonds and can cause matting and breakage.", imageB: null },
    guide: { title: "Bond Density Guide", accentWord: "", intro: "The density of the client's natural hair in a quarter-inch square determines the strand size to be used.", cells: "Standard Bond | For average density\nFine Bond | For lower density\nExtra Fine | For very fine hair\nCustom Bond | For unique density" },
  }[template];
  return { ...base, ...fill };
};

function blankToTemplate(slide, template) {
  const base = blankSlide(template, slide.theme);
  const carry = {};
  const text = slide.headline || slide.title || slide.heading || slide.text || "";
  if (template === "cover") carry.headline = text || base.headline;
  if (template === "list") carry.title = text || base.title;
  if (template === "number") carry.headline = text || base.headline;
  if (template === "stat") carry.title = text || base.title;
  if (template === "statement") carry.text = text || base.text;
  if (template === "tip") carry.heading = text || base.heading;
  if (template === "photo") carry.headline = text || base.headline;
  if (template === "cta") carry.heading = text || base.heading;
  if (template === "chart") carry.title = text || base.title;
  if (template === "compare") carry.title = text || base.title;
  if (template === "guide") carry.title = text || base.title;
  if (slide.accentWord) carry.accentWord = slide.accentWord;
  return { ...base, ...carry, template };
}

/* ── stable presentational components ─────────────────────────────────── */
function Field({ label, children }) {
  return <div style={{ marginBottom: 14 }}><label style={labelStyle}>{label}</label>{children}</div>;
}
function LInput({ label, value, onChange, ph }) {
  return <Field label={label}><input style={inputStyle} value={value ?? ""} placeholder={ph} onChange={(e) => onChange(e.target.value)} /></Field>;
}
function LArea({ label, value, onChange, ph, rows = 3 }) {
  return <Field label={label}><textarea style={{ ...inputStyle, lineHeight: 1.5 }} rows={rows} value={value ?? ""} placeholder={ph} onChange={(e) => onChange(e.target.value)} /></Field>;
}

function Thumb({ slide, idx, total, brand, opts, ready, ver, getImg, monogramSrc, selected, onSelect }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    renderSlide(ctx, c.width, slide, idx, total, brand, opts, getImg, monogramSrc);
  }, [slide, idx, total, brand, opts, ready, ver, getImg, monogramSrc]);
  return (
    <button onClick={onSelect} style={{ flex: "0 0 auto", position: "relative", padding: 0, border: "none", background: "none", cursor: "pointer", lineHeight: 0 }}>
      <canvas ref={ref} width={200} height={250} style={{
        width: 60, height: 75, borderRadius: 6,
        outline: selected ? "2.5px solid #20272D" : "1px solid #DAD0C4",
        outlineOffset: selected ? 1 : 0,
        boxShadow: selected ? "0 2px 8px rgba(32,39,45,.25)" : "none",
      }} />
      <span style={{ position: "absolute", bottom: 3, left: 5, fontFamily: "Lato, sans-serif", fontSize: 9, fontWeight: 600, color: selected ? "#20272D" : "#9B8E7E" }}>{idx + 1}</span>
    </button>
  );
}

function AddMenu({ onAdd }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpen((o) => !o)} title="Add slide" style={{ width: 60, height: 75, borderRadius: 6, border: `1.5px dashed ${UI.gold}`, background: "#FBF7F1", color: UI.gold, fontSize: 24, cursor: "pointer", lineHeight: 1 }}>+</button>
      {open && (
        <div style={{ position: "absolute", bottom: 82, left: 0, zIndex: 20, background: "#FFF", border: `1px solid ${UI.line}`, borderRadius: 10, boxShadow: "0 8px 24px rgba(32,39,45,.18)", padding: 6, width: 130 }}>
          {TEMPLATES.map((t) => (
            <button key={t.id} onClick={() => { onAdd(t.id); setOpen(false); }}
              style={{ display: "block", width: "100%", textAlign: "left", padding: "8px 10px", border: "none", background: "none", cursor: "pointer", fontSize: 13, fontWeight: 500, color: UI.ink, borderRadius: 6, fontFamily: "Lato, sans-serif" }}
              onMouseEnter={(e) => (e.currentTarget.style.background = "#F3EEE7")}
              onMouseLeave={(e) => (e.currentTarget.style.background = "none")}>{t.label}</button>
          ))}

      )}

  );
}

const pillBtn = (active) => ({ padding: "7px 13px", borderRadius: 8, border: `1px solid ${active ? UI.ink : UI.line}`, background: active ? UI.ink : "#FCFAF7", color: active ? "#FCF9F6" : UI.sub, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "Lato, sans-serif" });
const solidBtn = () => ({ padding: "8px 15px", borderRadius: 8, border: "none", background: UI.gold, color: "#FFF", fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "Lato, sans-serif" });
const miniBtn = () => ({ padding: "8px 13px", borderRadius: 8, border: `1px solid ${UI.line}`, background: "#FCFAF7", color: UI.ink, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "Lato, sans-serif" });
const panelBox = () => ({ marginTop: 12, padding: 14, background: "#FBF7F1", border: `1px solid ${UI.line}`, borderRadius: 10 });

/* ── MAIN ─────────────────────────────────────────────────────────────── */
function App() {
  const [slides, setSlides] = useState(SEED);
  const [sel, setSel] = useState(0);
  const [brands, setBrands] = useState({ miranda: { ...BRAND_PRESETS.miranda }, loves: { ...BRAND_PRESETS.loves } });
  const [brandKey, setBrandKey] = useState("miranda");
  const [monogram, setMonogram] = useState(null);
  const [opts, setOpts] = useState({ frame: false, swipe: true, counter: true, monogram: true, scriptFont: "Oooh Baby" });
  const [ready, setReady] = useState(false);
  const [ver, setVer] = useState(0);
  const [panel, setPanel] = useState(null);
  const [pasteText, setPasteText] = useState("");
  const [busy, setBusy] = useState(false);

  // mode = 'carousel' (multi-slide) or 'onepager' (single standalone graphic).
  // We keep a separate single-slide object for one-pagers so switching modes
  // never destroys the carousel you're working on.
  const [mode, setMode] = useState("carousel");
  const [onePager, setOnePager] = useState(blankSlide("chart", "cream"));

  const previewRef = useRef(null);
  const fileRef = useRef(null);
  const fileTarget = useRef(null); // 'image' | 'avatar' | 'imageA' | 'imageB' | 'logo' | 'monogram'
  const imgCache = useRef(new Map());

  const brand = brands[brandKey];
  // The "active" slide the editor + preview operate on, chosen by mode.
  const slide = mode === "carousel" ? slides[sel] : onePager;

  // Load fonts before first render so the canvas uses the real typefaces.
  useEffect(() => {
    const faces = [
      "900 64px Montserrat", "800 64px Montserrat", "700 64px Montserrat",
      "600 64px 'Playfair Display'", "500 64px 'Playfair Display'", "italic 500 64px 'Playfair Display'",
      "400 64px 'Oooh Baby'", "400 64px 'Shadows Into Light Two'", "400 64px 'Give You Glory'",
      "400 64px 'Permanent Marker'", "400 64px Allura", "400 64px Sacramento",
      "400 64px Lato", "700 64px Lato",
    ];
    let alive = true;
    Promise.all(faces.map((f) => document.fonts.load(f).catch(() => {})))
      .then(() => document.fonts.ready).then(() => { if (alive) setReady(true); })
      .catch(() => { if (alive) setReady(true); });
    return () => { alive = false; };
  }, []);

  const loadImage = useCallback((src) => {
    const c = imgCache.current;
    if (c.has(src)) { const e = c.get(src); return e instanceof Promise ? e : Promise.resolve(e); }
    const p = new Promise((res, rej) => { const im = new Image(); im.onload = () => { c.set(src, im); res(im); }; im.onerror = rej; im.src = src; });
    c.set(src, p); return p;
  }, []);

  const getImg = useCallback((src) => {
    const e = imgCache.current.get(src);
    return e && !(e instanceof Promise) ? e : null;
  }, []);

  // Preload all referenced images (slides + one-pager + brand logos + monogram).
  useEffect(() => {
    const srcs = [];
    slides.forEach((s) => { if (s.image) srcs.push(s.image); if (s.avatar) srcs.push(s.avatar); });
    [onePager.image, onePager.avatar, onePager.imageA, onePager.imageB].forEach((s) => { if (s) srcs.push(s); });
    Object.values(brands).forEach((b) => { if (b.logoImg) srcs.push(b.logoImg); });
    if (monogram) srcs.push(monogram);
    if (!srcs.length) return;
    let alive = true;
    Promise.all(srcs.map((s) => loadImage(s).catch(() => {}))).then(() => { if (alive) setVer((v) => v + 1); });
    return () => { alive = false; };
  }, [slides, onePager, brands, monogram, loadImage]);

  // Render the large preview when anything relevant changes.
  useEffect(() => {
    const c = previewRef.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    // One-pagers never show swipe cues or a slide counter.
    const eff = mode === "onepager" ? { ...opts, swipe: false, counter: false } : opts;
    const total = mode === "carousel" ? slides.length : 1;
    const idx = mode === "carousel" ? sel : 0;
    if (slide) renderSlide(ctx, c.width, slide, idx, total, brand, eff, getImg, monogram);
  }, [slide, slides, sel, brand, opts, ready, ver, getImg, monogram, mode, onePager]);

  // update() writes to whichever slide is active (carousel slide or one-pager).
  const update = (patch) => {
    if (mode === "carousel") setSlides((arr) => arr.map((s, i) => (i === sel ? { ...s, ...patch } : s)));
    else setOnePager((s) => ({ ...s, ...patch }));
  };
  const setBrandField = (patch) => setBrands((b) => ({ ...b, [brandKey]: { ...b[brandKey], ...patch } }));

  const addSlide = (template) => {
    const theme = template === "cover" || template === "cta" ? "gold" : slides.length % 2 ? "cream" : "navy";
    const next = [...slides];
    const at = sel + 1;
    next.splice(at, 0, blankSlide(template, theme));
    setSlides(next); setSel(at);
  };
  const duplicate = () => { const next = [...slides]; next.splice(sel + 1, 0, { ...slide }); setSlides(next); setSel(sel + 1); };
  const remove = () => { if (slides.length <= 1) return; setSlides(slides.filter((_, i) => i !== sel)); setSel(Math.max(0, sel - 1)); };
  const move = (dir) => {
    const j = sel + dir; if (j < 0 || j >= slides.length) return;
    const next = [...slides]; [next[sel], next[j]] = [next[j], next[sel]]; setSlides(next); setSel(j);
  };

  const pickFile = (target) => { fileTarget.current = target; fileRef.current?.click(); };
  const onFile = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const url = r.result;
      loadImage(url).then(() => {
        const t = fileTarget.current;
        if (t === "logo") setBrandField({ logoImg: url });
        else if (t === "monogram") setMonogram(url);
        else update({ [t]: url });
        setVer((v) => v + 1);
      });
    };
    r.readAsDataURL(f); e.target.value = "";
  };

  const downloadOne = async (index) => {
    const s = slides[index];
    const tasks = [];
    if (s.image) tasks.push(loadImage(s.image).catch(() => {}));
    if (s.avatar) tasks.push(loadImage(s.avatar).catch(() => {}));
    if (brand.logoImg) tasks.push(loadImage(brand.logoImg).catch(() => {}));
    if (monogram) tasks.push(loadImage(monogram).catch(() => {}));
    await Promise.all(tasks);
    const c = document.createElement("canvas");
    c.width = BASE_W; c.height = BASE_H;
    renderSlide(c.getContext("2d"), BASE_W, s, index, slides.length, brand, opts, getImg, monogram);
    await new Promise((res) => c.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = `slide-${index + 1}.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000); res();
    }, "image/png"));
  };
  const downloadAll = async () => {
    setBusy(true);
    for (let i = 0; i < slides.length; i++) { await downloadOne(i); await new Promise((r) => setTimeout(r, 350)); }
    setBusy(false);
  };

  // Export the single one-pager (no swipe/counter), at full resolution.
  const downloadOnePager = async () => {
    setBusy(true);
    const s = onePager;
    const tasks = [];
    [s.image, s.avatar, s.imageA, s.imageB, brand.logoImg, monogram].forEach((src) => { if (src) tasks.push(loadImage(src).catch(() => {})); });
    await Promise.all(tasks);
    const c = document.createElement("canvas");
    c.width = BASE_W; c.height = BASE_H;
    const eff = { ...opts, swipe: false, counter: false };
    renderSlide(c.getContext("2d"), BASE_W, s, 0, 1, brand, eff, getImg, monogram);
    await new Promise((res) => c.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = `one-pager.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000); res();
    }, "image/png"));
    setBusy(false);
  };

  // Build a whole carousel from one paste.
  // Preferred: a labeled, structured block per slide (what your Claude Project
  // outputs) — captures template, script word, stat data, etc. exactly.
  // Fallback: plain text (blank line between slides) still works, guessed.
  const buildFromText = () => {
    const raw = pasteText.trim();
    if (!raw) return;
    const structured = /^\s*type\s*:/im.test(raw);
    let out;

    if (structured) {
      // split on --- / === separator lines if present, else on blank lines
      const hasSep = /^\s*[-=]{3,}\s*$/m.test(raw);
      const chunks = hasSep
        ? raw.split(/^\s*[-=]{3,}\s*$/m)
        : raw.split(/\n\s*\n/);
      const norm = { hero: "cover", title: "cover", quote: "statement", end: "cta", outro: "cta", closing: "cta" };
      const slides = chunks.map((chunk) => chunk.trim()).filter(Boolean).map((chunk) => {
        const f = {}; let lastKey = null;
        chunk.split("\n").forEach((line) => {
          const m = line.match(/^\s*([A-Za-z]+)\s*:\s*(.*)$/);
          if (m) { lastKey = m[1].toUpperCase(); f[lastKey] = (m[2] || "").trim(); }
          else if (lastKey) { f[lastKey] += "\n" + line.trim(); } // continuation
        });
        const head = (f.HEADLINE || f.HEADING || f.TITLE || "").trim();
        const accent = (f.SCRIPT || f.ACCENT || "").trim();
        const body = (f.BODY || f.SUBTEXT || f.TEXT || "").trim();
        const t = norm[(f.TYPE || "").toLowerCase()] || (f.TYPE || "tip").toLowerCase();
        const theme = ["cream", "navy", "gold"].includes((f.THEME || "").toLowerCase()) ? f.THEME.toLowerCase() : null;
        const toSegs = (s) => (s || "").split(/\n|\s+\/\s+/).map((x) => x.trim()).filter(Boolean).join("\n");
        const toItems = (s) => (s || "").split(/\n|\s+\/\s+|;\s*/).map((x) => x.trim()).filter(Boolean).join("\n");
        let o;
        if (t === "cover") o = { template: "cover", kicker: f.KICKER || "Miranda | Hair Extension Expert & Salon Owner", headline: head, accentWord: accent };
        else if (t === "number") o = { template: "number", number: (f.NUMBER || "").trim(), headline: head, subtext: body };
        else if (t === "list") o = { template: "list", title: head, accentWord: accent, items: toItems(f.ITEMS), bullet: /dash|bullet/i.test(f.BULLET || "") };
        else if (t === "stat") o = { template: "stat", title: head, accentWord: accent, segments: toSegs(f.DATA || f.STATS || f.SEGMENTS) };
        else if (t === "statement") o = { template: "statement", text: (f.QUOTE || body), signature: (f.SIGNATURE || "").trim() };
        else if (t === "cta") o = { template: "cta", heading: head, accentWord: accent, subtext: body };
        else o = { template: "tip", heading: head, accentWord: accent, body };
        o._theme = theme; // remember explicit theme (if any)
        return o;
      });
      // assign themes: explicit wins; otherwise cover/cta gold, middle alternates
      out = slides.map((o, i) => {
        const auto = i === 0 || i === slides.length - 1 ? "gold" : (i % 2 ? "cream" : "navy");
        const theme = o._theme || auto;
        delete o._theme;
        return { ...o, theme };
      });
    } else {
      // legacy plain-text fallback
      const blocks = raw.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
      out = blocks.map((b, i) => {
        const lines = b.split("\n").map((l) => l.replace(/^[-•\d.]+\s*/, "").trim()).filter(Boolean);
        const first = lines[0] || "", rest = lines.slice(1);
        const theme = i === 0 || i === blocks.length - 1 ? "gold" : i % 2 ? "cream" : "navy";
        if (i === 0) return { template: "cover", theme, kicker: "Miranda | Hair Extension Expert & Salon Owner", headline: first, accentWord: "" };
        if (i === blocks.length - 1) return { template: "cta", theme, heading: first, accentWord: "", subtext: rest.join(" ") };
        if (rest.length >= 2) return { template: "list", theme, title: first, accentWord: "", items: rest.join("\n"), bullet: false };
        return { template: "tip", theme, heading: first, accentWord: "", body: rest.join("\n") };
      });
    }

    if (!out.length) return;
    setSlides(out); setSel(0); setPanel(null); setPasteText("");

          {slide.template === "guide" && (<>
            <LInput label="Title" value={slide.title} onChange={(v) => update({ title: v })} ph="Bond Density Guide" />
            <LInput label="Script accent word (optional)" value={slide.accentWord} onChange={(v) => update({ accentWord: v })} ph="" />
            <LArea label="Intro paragraph (optional)" value={slide.intro} onChange={(v) => update({ intro: v })} ph="The density of the client's natural hair in a quarter-inch square…" rows={2} />
            <LArea label="Boxes — one per line as: heading | description (up to 4)" value={slide.cells} onChange={(v) => update({ cells: v })} ph={"Standard Bond | For average density\nFine Bond | For lower density"} rows={4} />
          </>)}
        </div>

        <p style={{ textAlign: "center", fontSize: 11.5, color: UI.sub, padding: "4px 0 20px" }}>
          Exports as 1080×1350 (4:5) PNGs. Generate copy in your Claude Project, paste it above, then style &amp; download here.
        </p>
      </main>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

  </script>
</body>
</html>
